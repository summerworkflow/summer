<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词大挑战 - 儿童英语学习游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Marker Felt', 'Chalkboard SE', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6ecbf5 0%, #e4f5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .page {
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
            display: none;
            flex-direction: column;
        }
        
        .active-page {
            display: flex;
        }
        
        /* 全新首页背景 - 童趣风格 */
        #home-page {
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 40%, #7CFC00 40%, #7CFC00 100%);
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        
        /* 装饰元素 - 太阳 */
        .sun {
            position: absolute;
            top: 30px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFD700 60%, #FFA500);
            border-radius: 50%;
            box-shadow: 0 0 20px #FFD700;
            z-index: 1;
        }
        
        /* 云朵 */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            z-index: 1;
        }
        
        .cloud-1 {
            width: 120px;
            height: 50px;
            top: 60px;
            left: 50px;
            box-shadow: 60px 0 0 30px white, 30px -25px 0 40px white;
        }
        
        .cloud-2 {
            width: 100px;
            height: 40px;
            top: 100px;
            right: 100px;
            box-shadow: 50px 0 0 25px white, 25px -20px 0 35px white;
        }
        
        /* 气球 */
        .balloon {
            position: absolute;
            z-index: 2;
        }
        
        .balloon-1 {
            top: 100px;
            left: 100px;
            width: 50px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #FF6B6B, #D43F3F);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }
        
        .balloon-1::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 25px;
            width: 2px;
            height: 30px;
            background: #333;
        }
        
        .balloon-2 {
            top: 120px;
            right: 150px;
            width: 50px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #4e73df, #2a56c9);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }
        
        .balloon-2::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 25px;
            width: 2px;
            height: 30px;
            background: #333;
        }
        
        .balloon-3 {
            top: 80px;
            left: 250px;
            width: 50px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #4ECDC4, #3ab9b0);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }
        
        .balloon-3::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: 25px;
            width: 2px;
            height: 30px;
            background: #333;
        }
        
        /* 树木 */
        .tree {
            position: absolute;
            bottom: 40px;
            z-index: 3;
        }
        
        .tree-left {
            left: 50px;
            width: 100px;
            height: 150px;
        }
        
        .tree-right {
            right: 50px;
            width: 100px;
            height: 150px;
        }
        
        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 45px;
            width: 10px;
            height: 80px;
            background: #8B4513;
        }
        
        .tree-leaves {
            position: absolute;
            bottom: 80px;
            width: 100px;
            height: 100px;
            background: #228B22;
            border-radius: 50%;
        }
        
        /* 儿童形象 */
        .child {
            position: absolute;
            bottom: 40px;
            z-index: 4;
        }
        
        .child-1 {
            left: 200px;
        }
        
        .child-2 {
            left: 400px;
        }
        
        .child-3 {
            right: 200px;
        }
        
        .child-head {
            width: 40px;
            height: 40px;
            background: #FFD1A7;
            border-radius: 50%;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .child-body {
            width: 50px;
            height: 40px;
            background: #4e73df;
            border-radius: 10px 10px 0 0;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .child-legs {
            position: absolute;
            bottom: 0;
            width: 50px;
            height: 10px;
            display: flex;
            justify-content: space-between;
        }
        
        .leg {
            width: 15px;
            height: 40px;
            background: #4e73df;
            border-radius: 5px;
        }
        
        .child-arms {
            position: absolute;
            top: 10px;
            width: 60px;
            left: -5px;
            display: flex;
            justify-content: space-between;
        }
        
        .arm {
            width: 10px;
            height: 30px;
            background: #FFD1A7;
            border-radius: 5px;
        }
        
        .game-title {
            text-align: center;
            margin-bottom: 50px;
            color: #fff;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 5;
            position: relative;
        }
        
        .game-title h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: #ffde59;
            -webkit-text-stroke: 2px #ff6b6b;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            animation: bounce 2s infinite;
        }
        
        .game-title p {
            font-size: 1.5rem;
            color: #fff;
            max-width: 600px;
            margin: 0 auto;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(78, 115, 223, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
        }
        
        /* 按钮样式 */
        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            position: relative;
            overflow: hidden;
            margin: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 5;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.6);
        }
        
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.6);
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40px;
            height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(25deg);
            transition: all 0.6s;
        }
        
        .btn:hover::after {
            left: 120%;
        }
        
        .btn.secondary {
            background: linear-gradient(135deg, #4e73df 0%, #6a8dee 100%);
            box-shadow: 0 8px 20px rgba(78, 115, 223, 0.4);
        }
        
        .btn.secondary:hover {
            box-shadow: 0 12px 25px rgba(78, 115, 223, 0.6);
        }
        
        .btn.tertiary {
            background: linear-gradient(135deg, #4ECDC4 0%, #88d9d3 100%);
            box-shadow: 0 8px 20px rgba(78, 205, 196, 0.4);
        }
        
        .btn.tertiary:hover {
            box-shadow: 0 12px 25px rgba(78, 205, 196, 0.6);
        }
        
        .btn.quaternary {
            background: linear-gradient(135deg, #ff9f43 0%, #ffbe76 100%);
            box-shadow: 0 8px 20px rgba(255, 159, 67, 0.4);
        }
        
        .btn.quaternary:hover {
            box-shadow: 0 12px 25px rgba(255, 159, 67, 0.6);
        }
        
        /* 模式选择页 */
        #mode-selection-page {
            padding: 30px;
            justify-content: center;
            align-items: center;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="%23ffffff"/><circle cx="100" cy="100" r="40" fill="%23FFD700" opacity="0.2"/><circle cx="800" cy="150" r="60" fill="%234ECDC4" opacity="0.2"/><circle cx="200" cy="500" r="50" fill="%23FF6B6B" opacity="0.2"/><circle cx="700" cy="450" r="30" fill="%234e73df" opacity="0.2"/></svg>');
        }
        
        .mode-selection-content {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        
        .mode-selection-content h2 {
            font-size: 2.5rem;
            color: #ff6b6b;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }
        
        .mode-options {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        
        .mode-option {
            width: 250px;
            padding: 25px;
            margin: 15px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 3px solid transparent;
        }
        
        .mode-option:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: #4ECDC4;
        }
        
        .mode-option i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        
        .mode-option h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #4e73df;
        }
        
        .mode-option p {
            color: #666;
            font-size: 1rem;
        }
        
        /* 游戏页面 */
        #game-page {
            padding: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="%23f8f9fa"/><circle cx="100" cy="100" r="40" fill="%23FFD700" opacity="0.1"/><circle cx="800" cy="150" r="60" fill="%234ECDC4" opacity="0.1"/><circle cx="200" cy="500" r="50" fill="%23FF6B6B" opacity="0.1"/><circle cx="700" cy="450" r="30" fill="%234e73df" opacity="0.1"/></svg>');
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .word-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            margin: 20px 0;
        }
        
        .word-display {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .word-display .word {
            font-size: 3rem;
            color: #4e73df;
            font-weight: bold;
            margin-right: 20px;
        }
        
        .chinese-meaning {
            font-size: 1.8rem;
            color: #ff6b6b;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            min-height: 40px;
        }
        
        .sound-icon {
            width: 60px;
            height: 60px;
            background: #4ECDC4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(78, 205, 196, 0.4);
        }
        
        .sound-icon:hover {
            transform: scale(1.1);
            background: #3ab9b0;
        }
        
        .sound-icon i {
            color: white;
            font-size: 1.8rem;
        }
        
        .images-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }
        
        .image-option {
            width: 250px;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }
        
        .image-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #f0f0f0;
            color: #666;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }
        
        .result-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .correct .result-indicator {
            opacity: 1;
            background: #4CAF50;
            color: white;
        }
        
        .incorrect .result-indicator {
            opacity: 1;
            background: #F44336;
            color: white;
        }
        
        .correct {
            border: 4px solid #4CAF50;
        }
        
        .incorrect {
            border: 4px solid #F44336;
        }
        
        /* 结果页面 */
        #result-page {
            padding: 40px;
            justify-content: center;
            align-items: center;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="%23ffffff"/><circle cx="100" cy="100" r="40" fill="%23FFD700" opacity="0.2"/><circle cx="800" cy="150" r="60" fill="%234ECDC4" opacity="0.2"/><circle cx="200" cy="500" r="50" fill="%23FF6B6B" opacity="0.2"/><circle cx="700" cy="450" r="30" fill="%234e73df" opacity="0.2"/></svg>');
        }
        
        .result-content {
            text-align: center;
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        
        .result-content h2 {
            font-size: 2.5rem;
            color: #ff6b6b;
            margin-bottom: 30px;
        }
        
        .stats-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
            gap: 30px;
        }
        
        .stat-item {
            width: 150px;
            padding: 20px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }
        
        .stat-item.total {
            background: linear-gradient(135deg, #4e73df 0%, #6a8dee 100%);
        }
        
        .stat-item.correct {
            background: linear-gradient(135deg, #4CAF50 0%, #66bb6a 100%);
        }
        
        .stat-item.incorrect {
            background: linear-gradient(135deg, #F44336 0%, #ef5350 100%);
        }
        
        .stat-item .number {
            font-size: 3rem;
            margin: 10px 0;
        }
        
        .progress-container {
            margin: 30px 0;
        }
        
        .progress-bar {
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #66bb6a);
            border-radius: 15px;
            transition: width 0.5s ease-in-out;
        }
        
        .progress-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
        }
        
        .mistake-review {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 20px;
        }
        
        .mistake-review h3 {
            color: #4e73df;
            margin-bottom: 20px;
        }
        
        .mistake-list {
            list-style-type: none;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .mistake-list li {
            padding: 10px;
            background: white;
            margin: 5px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
        }
        
        .export-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        /* 文件上传样式 */
        .file-upload-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        
        .file-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .file-label {
            background: #4ECDC4;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .file-label:hover {
            background: #3ab9b0;
            transform: translateY(-3px);
        }
        
        .file-name {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .last-upload-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            font-size: 0.9rem;
            display: none;
        }
        
        /* 音乐控制 */
        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }
        
        .music-control i {
            font-size: 1.5rem;
            color: #ff6b6b;
        }
        
        /* 加载动画 */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4ECDC4;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 动画效果 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .images-container {
                flex-direction: column;
                align-items: center;
            }
            
            .image-option {
                width: 90%;
                max-width: 300px;
            }
            
            .stats-container {
                flex-direction: column;
                align-items: center;
            }
            
            .mode-options {
                flex-direction: column;
                align-items: center;
            }
            
            .word-display .word {
                font-size: 2.2rem;
            }
            
            .chinese-meaning {
                font-size: 1.5rem;
            }
            
            .game-title h1 {
                font-size: 2.5rem;
            }
            
            .export-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .child {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 音乐控制 -->
    <div class="music-control" id="music-control">
        <i class="fas fa-music"></i>
    </div>
    
    <!-- 首页 -->
    <div id="home-page" class="page active-page">
        <!-- 装饰元素 -->
        <div class="sun"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="balloon balloon-1"></div>
        <div class="balloon balloon-2"></div>
        <div class="balloon balloon-3"></div>
        
        <div class="tree tree-left">
            <div class="tree-trunk"></div>
            <div class="tree-leaves"></div>
        </div>
        
        <div class="tree tree-right">
            <div class="tree-trunk"></div>
            <div class="tree-leaves"></div>

    <!-- 音频元素 -->
    <audio id="click-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
    <audio id="correct-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3"></audio>
    <audio id="incorrect-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/19/audio_2e9f0f1c4d.mp3?filename=childrens-lullaby-131455.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // 游戏状态
        const gameState = {
            words: [], // 单词列表
            images: {}, // 图片映射表
            currentIndex: 0, // 当前单词索引
            correctAnswers: 0, // 答对数量
            incorrectAnswers: 0, // 答错数量
            mistakes: [], // 错题本
            isReviewMode: false, // 是否为错题复习模式
            isUsingLastUpload: false // 是否使用上次上传的数据
        };
        
        // 页面切换
        document.getElementById('start-btn').addEventListener('click', function() {
            playSound('click-sound');
            document.getElementById('home-page').classList.remove('active-page');
            document.getElementById('mode-selection-page').classList.add('active-page');
            startBackgroundMusic();
            
            // 检查是否有上次上传的数据
            checkLastUpload();
        });
        
        // 检查是否有上次上传的数据
        function checkLastUpload() {
            const lastUpload = localStorage.getItem('lastCustomUpload');
            if (lastUpload) {
                const data = JSON.parse(lastUpload);
                document.getElementById('last-upload-info').style.display = 'block';
                document.getElementById('file-upload-section').style.display = 'none';
                document.getElementById('last-upload-details').textContent = 
                    `${data.wordCount} 个单词, ${data.imageCount} 张图片`;
            } else {
                document.getElementById('last-upload-info').style.display = 'none';
                document.getElementById('file-upload-section').style.display = 'block';
            }
        }
        
        document.getElementById('back-to-home').addEventListener('click', function() {
            playSound('click-sound');
            document.getElementById('mode-selection-page').classList.remove('active-page');
            document.getElementById('home-page').classList.add('active-page');
        });
        
        document.getElementById('custom-mode').addEventListener('click', function() {
            playSound('click-sound');
            document.getElementById('custom-upload').style.display = 'block';
            checkLastUpload();
        });
        
        // 重新上传按钮
        document.getElementById('re-upload-btn').addEventListener('click', function() {
            playSound('click-sound');
            document.getElementById('last-upload-info').style.display = 'none';
            document.getElementById('file-upload-section').style.display = 'block';
            localStorage.removeItem('lastCustomUpload');
        });
        
        // 直接开始游戏按钮（使用上次数据）
        document.getElementById('start-with-last-data').addEventListener('click', function() {
            playSound('click-sound');
            const lastUpload = localStorage.getItem('lastCustomUpload');
            if (lastUpload) {
                const data = JSON.parse(lastUpload);
                gameState.words = data.words;
                gameState.images = data.images;
                startGame();
            } else {
                alert('没有找到上次上传的数据，请重新上传');
            }
        });
        
        document.getElementById('end-game-btn').addEventListener('click', function() {
            playSound('click-sound');
            endGame();
        });
        
        document.getElementById('play-again').addEventListener('click', function() {
            playSound('click-sound');
            resetGame();
            document.getElementById('result-page').classList.remove('active-page');
            document.getElementById('home-page').classList.add('active-page');
        });
        
        document.getElementById('review-mistakes').addEventListener('click', function() {
            playSound('click-sound');
            startReviewMode();
        });
        
        document.getElementById('review-btn').addEventListener('click', function() {
            playSound('click-sound');
            if (gameState.mistakes.length > 0) {
                startReviewMode();
            } else {
                alert('当前没有错题需要复习！');
            }
        });
        
        // 文件选择处理
        document.getElementById('word-file').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : '未选择文件';
            document.getElementById('word-file-name').textContent = fileName;
        });
        
        document.getElementById('image-folder').addEventListener('change', function(e) {
            const fileCount = e.target.files.length;
            document.getElementById('image-folder-name').textContent = fileCount > 0 ? `已选择 ${fileCount} 张图片` : '未选择文件夹';
        });
        
        document.getElementById('start-custom-game').addEventListener('click', function() {
            const wordFile = document.getElementById('word-file').files[0];
            const imageFiles = document.getElementById('image-folder').files;
            
            // 检查是否使用上次上传的数据
            const lastUpload = localStorage.getItem('lastCustomUpload');
            if (lastUpload) {
                const data = JSON.parse(lastUpload);
                gameState.words = data.words;
                gameState.images = data.images;
                startGame();
                return;
            }
            
            if (!wordFile) {
                alert('请选择单词文件！');
                return;
            }
            
            if (imageFiles.length === 0) {
                alert('请选择图片文件夹！');
                return;
            }
            
            // 读取Excel文件
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    // 获取第一个工作表
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    // 获取A列和B列数据
                    const words = [];
                    let row = 1;
                    while (worksheet[`A${row}`] && worksheet[`B${row}`]) {
                        words.push({
                            word: worksheet[`A${row}`].v,
                            chinese: worksheet[`B${row}`].v
                        });
                        row++;
                    }
                    
                    // 处理图片文件
                    processImageFiles(imageFiles, words);
                    
                } catch (error) {
                    console.error('Excel解析错误:', error);
                    alert('解析Excel文件时出错，请检查文件格式');
                }
            };
            reader.readAsArrayBuffer(wordFile);
        });
        
        // 处理图片文件
        function processImageFiles(imageFiles, words) {
            // 创建图片映射表
            gameState.images = {};
            
            for (let i = 0; i < imageFiles.length; i++) {
                const file = imageFiles[i];
                const fileName = file.name.toLowerCase();
                
                // 移除文件扩展名作为单词键
                const wordKey = fileName.replace(/\.[^/.]+$/, "");
                
                // 创建图片URL
                gameState.images[wordKey] = URL.createObjectURL(file);
            }
            
            // 创建单词列表
            gameState.words = words.map(wordItem => {
                const wordKey = wordItem.word.toLowerCase().trim();
                return {
                    word: wordItem.word,
                    chinese: wordItem.chinese,
                    image: wordKey // 直接使用单词作为图片键
                };
            }).filter(item => gameState.images[item.image] !== undefined);
            
            // 检查是否有有效单词
            if (gameState.words.length === 0) {
                alert('未找到匹配的单词图片！请确保图片文件名与单词匹配');
                return;
            }
            
            // 保存本次上传的数据
            saveLastUpload();
            
            // 开始游戏
            startGame();
        }
        
        // 保存上次上传的数据
        function saveLastUpload() {
            const uploadData = {
                words: gameState.words,
                images: gameState.images,
                wordCount: gameState.words.length,
                imageCount: Object.keys(gameState.images).length,
                timestamp: new Date().toLocaleString()
            };
            
            localStorage.setItem('lastCustomUpload', JSON.stringify(uploadData));
        }
        
        // 初始化游戏
        function startGame() {
            // 重置游戏状态
            resetGame();
            
            gameState.isReviewMode = false;
            
            // 显示游戏页面
            document.getElementById('mode-selection-page').classList.remove('active-page');
            document.getElementById('game-page').classList.add('active-page');
            
            // 更新进度显示
            document.getElementById('current-word').textContent = gameState.currentIndex + 1;
            document.getElementById('total-words').textContent = gameState.words.length;
            
            // 加载第一个单词
            loadWord();
        }
        
        // 开始错题复习模式
        function startReviewMode() {
            // 重置游戏状态
            resetGame();
            
            // 设置错题复习模式
            gameState.isReviewMode = true;
            
            // 从错题本中提取单词（每个错题只出现一次）
            const uniqueMistakes = [...new Set(gameState.mistakes)];
            gameState.reviewWords = uniqueMistakes.map(word => 
                gameState.words.find(item => item.word === word)
            ).filter(item => item);
            
            if (gameState.reviewWords.length === 0) {
                alert('没有需要复习的错题！');
                return;
            }
            
            // 设置复习单词列表
            gameState.words = [...gameState.reviewWords];
            
            // 显示游戏页面（直接跳过模式选择页）
            document.getElementById('result-page').classList.remove('active-page');
            document.getElementById('game-page').classList.add('active-page');
            
            // 更新进度显示
            document.getElementById('current-word').textContent = gameState.currentIndex + 1;
            document.getElementById('total-words').textContent = gameState.words.length;
            
            // 加载第一个单词
            loadWord();
        }
        
        // 加载当前单词
        function loadWord() {
            const currentWord = gameState.words[gameState.currentIndex];
            
            // 显示单词（初始不显示中文释义）
            document.getElementById('current-word-display').textContent = currentWord.word;
            document.getElementById('chinese-meaning').textContent = "";
            
            // 自动发音
            setTimeout(() => {
                speakWord(currentWord.word);
            }, 300);
            
            // 生成图片选项
            generateImageOptions(currentWord);
            
            // 更新进度
            document.getElementById('current-word').textContent = gameState.currentIndex + 1;
        }
        
        // 生成图片选项（3张图片：1张正确，2张干扰）
        function generateImageOptions(currentWord) {
            const container = document.getElementById('images-container');
            container.innerHTML = '';
            
            // 获取当前单词对应的图片URL
            const correctImage = gameState.images[currentWord.image] || getRandomImage();
            
            // 获取其他随机单词（排除当前单词）
            const otherWords = gameState.words.filter(word => word.word !== currentWord.word);
            
            // 随机选择三个其他单词
            const randomWords = [];
            while (randomWords.length < 3 && otherWords.length > 0) {
                const randomIndex = Math.floor(Math.random() * otherWords.length);
                const selectedWord = otherWords[randomIndex];
                
                // 确保不重复选择
                if (!randomWords.includes(selectedWord)) {
                    randomWords.push(selectedWord);
                }
            }
            
            // 创建图片选项数组
            const imageOptions = [
                { word: currentWord.word, image: correctImage, isCorrect: true }
            ];
            
            // 添加干扰图片
            for (let i = 0; i < 3; i++) {
                if (i < randomWords.length) {
                    const word = randomWords[i];
                    imageOptions.push({
                        word: word.word,
                        image: gameState.images[word.image] || getRandomImage(),
                        isCorrect: false
                    });
                } else {
                    // 如果干扰项不足，使用随机图片
                    imageOptions.push({
                        word: "干扰项",
                        image: getRandomImage(),
                        isCorrect: false
                    });
                }
            }
            
            // 随机排序图片选项
            for (let i = imageOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [imageOptions[i], imageOptions[j]] = [imageOptions[j], imageOptions[i]];
            }
            
            // 生成图片选项
            imageOptions.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'image-option';
                optionElement.dataset.correct = option.isCorrect;
                
                if (option.image) {
                    optionElement.innerHTML = `
                        <img src="${option.image}" alt="选项 ${index + 1}">
                        <div class="result-indicator">
                            <i class="fas ${option.isCorrect ? 'fa-check' : 'fa-times'}"></i>
                        </div>
                    `;
                } else {
                    optionElement.innerHTML = `
                        <div class="image-placeholder">
                            <div>${option.word}</div>
                        </div>
                        <div class="result-indicator">
                            <i class="fas ${option.isCorrect ? 'fa-check' : 'fa-times'}"></i>
                        </div>
                    `;
                }
                
                optionElement.addEventListener('click', () => handleImageSelect(optionElement, option.isCorrect, currentWord.chinese));
                container.appendChild(optionElement);
            });
        }
        
        // 获取随机图片（用于干扰项）
        function getRandomImage() {
            // 使用Pexels的儿童主题图片API
            const keywords = ['children', 'toy', 'animal', 'fruit', 'nature', 'cartoon', 'education'];
            const randomKeyword = keywords[Math.floor(Math.random() * keywords.length)];
            return `https://source.unsplash.com/featured/250x200/?${randomKeyword}`;
        }
        
        // 处理图片选择
        function handleImageSelect(option, isCorrect, chinese) {
            // 防止多次点击
            if (option.classList.contains('correct') || option.classList.contains('incorrect')) {
                return;
            }
            
            if (isCorrect) {
                // 正确答案处理
                option.classList.add('correct');
                playSound('correct-sound'); // 正确音效
                gameState.correctAnswers++;
                
                // 显示中文释义
                document.getElementById('chinese-meaning').textContent = chinese;
                
                // 如果是错题复习模式，从错题本中移除该单词（如果存在）
                if (gameState.isReviewMode) {
                    const word = gameState.words[gameState.currentIndex].word;
                    const index = gameState.mistakes.indexOf(word);
                    if (index !== -1) {
                        gameState.mistakes.splice(index, 1);
                    }
                }
                
                // 延迟后进入下一个单词
                setTimeout(() => {
                    nextWord();
                }, 1000);
            } else {
                // 错误答案处理
                option.classList.add('incorrect');
                playSound('incorrect-sound'); // 错误音效
                gameState.incorrectAnswers++;
                
                // 添加到错题本
                const word = gameState.words[gameState.currentIndex].word;
                if (!gameState.mistakes.includes(word)) {
                    gameState.mistakes.push(word);
                }
                
                // 禁用当前错误选项
                option.style.pointerEvents = 'none';
            }
        }
        
        // 进入下一个单词
        function nextWord() {
            gameState.currentIndex++;
            
            if (gameState.currentIndex < gameState.words.length) {
                loadWord();
            } else {
                endGame();
            }
        }
        
        // 结束游戏
        function endGame() {
            // 更新统计信息
            const total = gameState.correctAnswers + gameState.incorrectAnswers;
            const accuracy = total > 0 ? Math.round((gameState.correctAnswers / total) * 100) : 0;
            
            document.getElementById('total-stat').textContent = total;
            document.getElementById('correct-stat').textContent = gameState.correctAnswers;
            document.getElementById('incorrect-stat').textContent = gameState.incorrectAnswers;
            
            document.getElementById('progress-fill').style.width = `${accuracy}%`;
            
            let message = '';
            if (accuracy >= 90) message = `${accuracy}% 正确率 - 太棒了！你是单词小天才！`;
            else if (accuracy >= 70) message = `${accuracy}% 正确率 - 做得很好！继续加油！`;
            else if (accuracy >= 50) message = `${accuracy}% 正确率 - 不错，再练习一下会更好！`;
            else message = `${accuracy}% 正确率 - 需要多练习哦！`;
            
            document.getElementById('progress-text').textContent = message;
            
            // 更新错题列表
            const mistakeList = document.getElementById('mistake-list');
            mistakeList.innerHTML = '';
            
            // 统计每个错题出现的次数
            const mistakeCounts = {};
            gameState.mistakes.forEach(word => {
                mistakeCounts[word] = (mistakeCounts[word] || 0) + 1;
            });
            
            // 添加错题到列表
            Object.entries(mistakeCounts).forEach(([word, count]) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${word}</span><span>错误次数: ${count}</span>`;
                mistakeList.appendChild(li);
            });
            
            // 如果没有错题
            if (Object.keys(mistakeCounts).length === 0) {
                const li = document.createElement('li');
                li.textContent = "太棒了！本次练习没有错题！";
                li.style.textAlign = 'center';
                li.style.fontStyle = 'italic';
                li.style.color = '#666';
                mistakeList.appendChild(li);
            }
            
            // 切换到结果页
            document.getElementById('game-page').classList.remove('active-page');
            document.getElementById('result-page').classList.add('active-page');
        }
        
        // 重置游戏状态
        function resetGame() {
            gameState.currentIndex = 0;
            gameState.correctAnswers = 0;
            gameState.incorrectAnswers = 0;
            // 注意：我们不重置错题本，以便错题可以跨游戏保存
        }
        
        // 发音功能
        document.getElementById('sound-icon').addEventListener('click', function() {
            const currentWord = gameState.words[gameState.currentIndex];
            if (currentWord) {
                speakWord(currentWord.word);
            }
        });
        
        // 背景音乐控制
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.3; // 设置适中音量
        
        function startBackgroundMusic() {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => {
                    console.log('自动播放被阻止，需要用户交互');
                });
                document.getElementById('music-control').innerHTML = '<i class="fas fa-music"></i>';
            }
        }
        
        document.getElementById('music-control').addEventListener('click', function() {
            if (bgMusic.paused) {
                bgMusic.play();
                this.innerHTML = '<i class="fas fa-music"></i>';
            } else {
                bgMusic.pause();
                this.innerHTML = '<i class="fas fa-volume-mute"></i>';
            }
        });
        
        // 错题本导出功能
        document.getElementById('export-mistakes').addEventListener('click', async function() {
            playSound('click-sound');
            
            if (gameState.mistakes.length === 0) {
                alert('错题本为空，没有内容可以导出！');
                return;
            }
            
            const exportLoader = document.getElementById('export-loader');
            const exportStatus = document.getElementById('export-status');
            
            // 显示加载动画
            exportLoader.style.display = 'block';
            exportStatus.textContent = '正在准备导出文件...';
            
            try {
                // 获取去重后的错题本单词
                const uniqueMistakes = [...new Set(gameState.mistakes)];
                
                // 1. 准备Excel数据
                const excelData = [['单词', '中文释义']];
                
                // 收集单词对应的图片
                const imagePromises = [];
                const imageFiles = {};
                
                uniqueMistakes.forEach(word => {
                    // 查找单词信息
                    const wordInfo = gameState.words.find(item => item.word === word);
                    if (wordInfo) {
                        // 添加到Excel
                        excelData.push([wordInfo.word, wordInfo.chinese]);
                        
                        // 获取图片URL
                        const imageUrl = gameState.images[wordInfo.image];
                        if (imageUrl) {
                            // 创建图片文件名
                            const fileName = `${wordInfo.word}.${getFileExtension(imageUrl)}`;
                            
                            // 获取图片Blob
                            if (imageUrl.startsWith('blob:')) {
                                // 处理Blob URL
                                imagePromises.push(
                                    fetch(imageUrl)
                                        .then(response => response.blob())
                                        .then(blob => {
                                            imageFiles[fileName] = blob;
                                        })
                                );
                            } else {
                                // 处理网络URL（需要CORS支持）
                                imagePromises.push(
                                    fetch(imageUrl)
                                        .then(response => {
                                            if (!response.ok) throw new Error('网络响应错误');
                                            return response.blob();
                                        })
                                        .then(blob => {
                                            imageFiles[fileName] = blob;
                                        })
                                        .catch(error => {
                                            console.error(`无法获取图片: ${wordInfo.word}`, error);
                                            exportStatus.textContent = `警告：部分图片无法导出 (${wordInfo.word})`;
                                        })
                                );
                            }
                        }
                    }
                });
                
                // 等待所有图片下载完成
                await Promise.all(imagePromises);
                
                // 2. 创建Excel文件
                const worksheet = XLSX.utils.aoa_to_sheet(excelData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, '错题本');
                const excelBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                
                // 3. 创建压缩包
                const zip = new JSZip();
                
                // 添加Excel文件
                zip.file('错题本.xlsx', excelBuffer);
                
                // 添加图片文件夹
                const imgFolder = zip.folder('错题图片');
                for (const [fileName, blob] of Object.entries(imageFiles)) {
                    imgFolder.file(fileName, blob);
                }
                
                // 生成压缩包
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                
                // 下载压缩包
                saveAs(zipBlob, '单词错题本.zip');
                
                // 更新状态
                exportStatus.textContent = '导出成功！文件已下载';
                exportLoader.style.display = 'none';
                
            } catch (error) {
                console.error('导出错题本时出错:', error);
                exportStatus.textContent = '导出失败，请重试';
                exportLoader.style.display = 'none';
            }
        });
        
        // 获取文件扩展名
        function getFileExtension(url) {
            if (url.startsWith('blob:')) {
                // 从Blob URL中提取MIME类型
                const match = url.match(/^blob:(.+?)\/(.+?);/);
                if (match && match[2]) {
                    return match[2]; // 返回扩展名
                }
            } else {
                // 从普通URL中提取扩展名
                const match = url.match(/\.([a-zA-Z0-9]+)(\?|$)/);
                if (match && match[1]) {
                    return match[1];
                }
            }
            return 'jpg'; // 默认扩展名
        }
        
        // 辅助函数
        function playSound(soundId) {
            const sound = document.getElementById(soundId);
            sound.currentTime = 0;
            sound.play();
        }
        
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.pitch = 1.2;
                utterance.rate = 0.9;
                
                // 尝试设置女声
                const voices = speechSynthesis.getVoices();
                const femaleVoice = voices.find(voice => 
                    voice.lang.includes('en') && voice.name.includes('Female'));
                
                if (femaleVoice) {
                    utterance.voice = femaleVoice;
                }
                
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音合成功能');
            }
        }
        
        // 初始化语音合成
        window.speechSynthesis.getVoices();
        
        // 初始化时检查是否有上次上传的数据
        window.addEventListener('DOMContentLoaded', function() {
            const lastUpload = localStorage.getItem('lastCustomUpload');
            if (lastUpload) {
                gameState.isUsingLastUpload = true;
                const data = JSON.parse(lastUpload);
                gameState.words = data.words;
                gameState.images = data.images;
            }
        });
    </script>
</body>
</html>
